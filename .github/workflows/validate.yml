name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version is asserted against the manifest itself, never hard-coded here:
      # a version pinned in this file is exactly what went stale when the plugin was
      # renamed waystone -> hippo and every sync failed CI for two days unnoticed.
      - name: Validate marketplace contract
        run: |
          set -euo pipefail
          file=.agents/plugins/marketplace.json
          jq -e '
            .name == "jahns-codex-marketplace" and
            (.interface.displayName | type == "string" and length > 0) and
            (.plugins | length == 2) and
            (.plugins[0].name == "hippo") and
            (.plugins[0].source.source == "url") and
            (.plugins[0].source.url == "https://github.com/Dev-Jahn/hippocampus.git") and
            (.plugins[0].source.sha | test("^[0-9a-f]{40}$")) and
            (.plugins[0].version | type == "string" and length > 0) and
            (.plugins[0].policy.installation == "AVAILABLE") and
            (.plugins[0].policy.authentication == "ON_INSTALL") and
            (.plugins[0].category == "Developer Tools") and
            (.plugins[1].name == "khala-network-codex") and
            (.plugins[1].source.source == "url") and
            (.plugins[1].source.url == "https://github.com/Dev-Jahn/khala-network-codex.git") and
            (.plugins[1].source.sha | test("^[0-9a-f]{40}$")) and
            (.plugins[1].version | type == "string" and length > 0) and
            (.plugins[1].policy.installation == "AVAILABLE") and
            (.plugins[1].policy.authentication == "ON_INSTALL") and
            (.plugins[1].category == "Developer Tools")
          ' "$file" >/dev/null

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.153.4

      - name: Install each plugin from the marketplace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codex-home"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          for plugin in hippo khala-network-codex; do
            codex plugin list --marketplace jahns-codex-marketplace --available --json \
              | jq -e --arg name "$plugin" '.available[] | select(.name == $name)' >/dev/null
            install=$(codex plugin add "$plugin@jahns-codex-marketplace" --json)
            jq -e --arg name "$plugin" '.name == $name and .pluginId == ($name + "@jahns-codex-marketplace")' <<<"$install" >/dev/null
            installed_path=$(jq -r .installedPath <<<"$install")
            expected=$(jq -r --arg name "$plugin" '.plugins[] | select(.name == $name) | .version' .agents/plugins/marketplace.json)
            jq -e --arg name "$plugin" --arg v "$expected" '.name == $name and .version == $v' \
              "$installed_path/.codex-plugin/plugin.json" >/dev/null
            codex plugin list --marketplace jahns-codex-marketplace --json \
              | jq -e --arg name "$plugin" '.installed[] | select(.name == $name and .installed == true)' >/dev/null
          done
