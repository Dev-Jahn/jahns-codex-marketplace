name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version is asserted against the manifest itself, never hard-coded here:
      # a version pinned in this file is exactly what went stale when the plugin was
      # renamed waystone -> hippo and every sync failed CI for two days unnoticed.
      - name: Validate marketplace contract
        run: |
          set -euo pipefail
          file=.agents/plugins/marketplace.json
          jq -e '
            .name == "jahns-codex-marketplace" and
            (.interface.displayName | type == "string" and length > 0) and
            (.plugins | length == 1) and
            (.plugins[0].name == "hippo") and
            (.plugins[0].source.source == "url") and
            (.plugins[0].source.url == "https://github.com/Dev-Jahn/hippocampus.git") and
            (.plugins[0].source.sha | test("^[0-9a-f]{40}$")) and
            (.plugins[0].version | type == "string" and length > 0) and
            (.plugins[0].policy.installation == "AVAILABLE") and
            (.plugins[0].policy.authentication == "ON_INSTALL") and
            (.plugins[0].category == "Developer Tools")
          ' "$file" >/dev/null

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.144.4

      - name: Install hippo from the marketplace
        run: |
          set -euo pipefail
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin list --marketplace jahns-codex-marketplace --available --json \
            | jq -e '.available[] | select(.name == "hippo")' >/dev/null
          install=$(codex plugin add hippo@jahns-codex-marketplace --json)
          jq -e '
            .name == "hippo" and
            .pluginId == "hippo@jahns-codex-marketplace"
          ' <<<"$install" >/dev/null
          installed_path=$(jq -r .installedPath <<<"$install")
          expected=$(jq -r '.plugins[0].version' .agents/plugins/marketplace.json)
          jq -e --arg v "$expected" '.name == "hippo" and .version == $v' \
            "$installed_path/.codex-plugin/plugin.json" >/dev/null
          codex plugin list --marketplace jahns-codex-marketplace --json \
            | jq -e '.installed[] | select(.name == "hippo" and .installed == true)' \
            >/dev/null
